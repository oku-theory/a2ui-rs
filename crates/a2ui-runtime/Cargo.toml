[package]
name = "a2ui-runtime"
description = "Renderer-side runtime for the A2UI v1.0 protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["a2ui", "ui", "protocol", "agent", "renderer"]
categories = ["gui", "wasm"]
# An allowlist, so tests/ (trybuild's cases hold the pinned rustc's wording) and any file not
# listed stay out of the package (plan 2b, Decision 42). README.md ships through `readme`. NOTICE-A2UI exists
# only while upstream has a NOTICE (vendor/sync.sh copies it); listed so that it ships the day it
# does. `just package` builds the crate from these files alone.
include = [
    "src/**",
    "schemas/v1_0/common_types.json",
    "schemas/v1_0/agent_to_renderer.json",
    "schemas/v1_0/LICENSE",
    "schemas/v1_0/NOTICE-A2UI",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "Cargo.toml",
]

[dependencies]
snafu.workspace = true
serde_json.workspace = true
unicode-ident.workspace = true
jsonschema.workspace = true
percent-encoding.workspace = true
nom.workspace = true

[dev-dependencies]
rstest.workspace = true
speculoos.workspace = true
trybuild.workspace = true

[lints]
workspace = true
