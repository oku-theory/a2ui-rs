# release-plz: opens a release PR (version bump + CHANGELOG from Conventional Commits)
# and publishes to crates.io only when that PR is merged.
[workspace]
release_always = false
changelog_update = true
git_release_enable = true
git_tag_enable = true
# cargo-semver-checks resolves and builds the crates outside Cargo.lock, so unreviewed releases
# would run beside release-pr's write token; ci.yml's read-only semver-checks job runs it on the
# release PR instead (plan 2b, Decisions 23 and 28).
semver_check = false
# release-plz.yml's `package` job builds each package from the reviewed Cargo.lock on the commit
# `release` publishes, which needs it; publishing skips that build, so no dependency build script
# runs beside the crates.io token (plan 2b, Decision 25).
publish_no_verify = true

# Unpublished conformance harness.
[[package]]
name = "a2ui-conformance"
release = false

# Its first release is published by hand: trusted publishing cannot create a crate, and 0.1.0
# does not build against a2ui-runtime 0.1.0. release-plz tags it and publishes a2ui-runtime only;
# remove this once a2ui-catalog-basic is on crates.io with its trusted publisher (plan 2b,
# Decision 33).
[[package]]
name = "a2ui-catalog-basic"
publish = false
