[package]
name = "a2ui-fuzz"
description = "libFuzzer targets for a2ui-runtime's agent-facing entry points."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Its own workspace, so libfuzzer-sys and its C++ build stay out of the published crates' lock,
# MSRV and minimal-versions builds. Its Cargo.lock is generated, not committed: the root lock's
# packages, then fuzz-only.lock's pins (`just fuzz-lockfile`; `just fuzz-lock` rewrites the pins).
[workspace]
members = ["."]

# serde_json, rstest and speculoos mirror the root Cargo.toml's requirements.
[workspace.dependencies]
a2ui-catalog-basic = { path = "../crates/a2ui-catalog-basic" }
a2ui-runtime = { path = "../crates/a2ui-runtime" }
libfuzzer-sys = "0.4.13"
rstest = "0.28.0"
serde_json = "1.0.154"
speculoos = "0.13.0"

[dependencies]
a2ui-catalog-basic.workspace = true
a2ui-runtime.workspace = true
libfuzzer-sys.workspace = true
serde_json.workspace = true

[dev-dependencies]
rstest.workspace = true
speculoos.workspace = true

# The root workspace's lints; a harness may expect, with a reason (a panic is the finding).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
allow_attributes = "deny"

[[bin]]
name = "catalog_parse"
path = "fuzz_targets/catalog_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "validate_component"
path = "fuzz_targets/validate_component.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_then_validate"
path = "fuzz_targets/parse_then_validate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "template_parse"
path = "fuzz_targets/template_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pointer_parse"
path = "fuzz_targets/pointer_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message_parse"
path = "fuzz_targets/message_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "regex_match"
path = "fuzz_targets/regex_match.rs"
test = false
doc = false
bench = false
