[workspace]
resolver = "3"
members = ["crates/a2ui-runtime", "crates/a2ui-catalog-basic", "crates/a2ui-conformance"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oku-theory/a2ui-rs"

[workspace.dependencies]
a2ui-catalog-basic = { path = "crates/a2ui-catalog-basic", version = "0.1.0" }
a2ui-runtime = { path = "crates/a2ui-runtime", version = "0.1.0" }
# Exact, for the top crate only: users get the error texts our tests quote (both libraries').
# Its dependencies float for them: referencing ($ref), jsonschema-regex, jsonschema-value,
# regex (which runs `pattern`), fancy-regex. A graph needing jsonschema >= 0.61.2, a security
# fix included, fails to resolve until our bump (plan 2b, Decision 26).
jsonschema = { version = "=0.61.1", default-features = false }
libtest-mimic = "0.8"
percent-encoding = "2"
regex = "1"
rstest = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
snafu = "0.9"
speculoos = "0.13"
toml = "1"
trybuild = "1"
unicode-ident = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
allow_attributes = "deny"
